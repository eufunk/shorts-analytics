[project]
name = "shorts-analytics"
version = "0.1.0"
description = "Datenbasierter Research-Agent zur Analyse erfolgreicher YouTube Shorts (Zuschauerbindung, Themen, Hooks, Formate)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pandas>=2.2",
    "google-api-python-client>=2.130",
    "anthropic>=0.34",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-mock>=3.14",
]
dashboard = [
    "streamlit>=1.38",
    "plotly>=5.24",
    "openpyxl>=3.1",
]

[project.scripts]
shorts-analytics = "shorts_analytics.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
